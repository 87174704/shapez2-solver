name: Verify maintained solver
on:
  push:
    branches: [codex/maintained, codex/crystal-physics-fix-20261029]
  pull_request:
    branches: [codex/maintained, codex/crystal-physics-fix-20261029]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout complete verification history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Install locked tooling without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install locked static build tooling
        run: npm ci --prefix tools/static-build --ignore-scripts --no-audit --no-fund
      - name: Verify source, Benchmark and regressions
        run: |
          git config core.autocrlf input
          node scripts/ci/verify.mjs
      - name: Retain traceable verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
