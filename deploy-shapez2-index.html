<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shapez2 工具索引</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1015;
      --card: rgba(18, 23, 31, 0.92);
      --line: rgba(255,255,255,0.10);
      --text: #eef2f7;
      --muted: #9fb0c8;
      --accent: #6ee7ff;
      --accent-2: #8bffb0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(110,231,255,0.20), transparent 34%),
        radial-gradient(circle at bottom right, rgba(139,255,176,0.16), transparent 28%),
        linear-gradient(160deg, #080b10 0%, #111722 52%, #0c121b 100%);
    }

    .panel {
      width: min(860px, 100%);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--card);
      box-shadow: 0 24px 80px rgba(0,0,0,0.42);
      padding: 36px;
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 56px);
      line-height: 1.02;
    }

    .sub {
      margin: 16px 0 0;
      max-width: 56ch;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-top: 30px;
    }

    .card {
      padding: 20px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
    }

    .card h2 {
      margin: 0;
      font-size: 20px;
    }

    .card p {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid transparent;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, #94f0ff 100%);
      color: #081018;
    }

    .btn-secondary {
      border-color: var(--line);
      color: var(--text);
      background: rgba(255,255,255,0.03);
    }

    .foot {
      margin-top: 26px;
      color: #7d8ea5;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="panel">
    <p class="eyebrow">shapez2.ysc.icu</p>
    <h1>Shapez2 工具索引</h1>
    <p class="sub">这里作为 Shapez2 相关网页工具的统一入口。后续新的页面、计算器和实验工具都会继续放到这个域名下面。</p>

    <section class="grid">
      <article class="card">
        <h2>Solver</h2>
        <p>当前已上线工具。</p>
        <div class="actions">
          <a class="btn btn-primary" href="/solver/">打开</a>
          <a class="btn btn-secondary" href="/solver/cn/">中文</a>
          <a class="btn btn-secondary" href="/solver/en/">English</a>
        </div>
      </article>

      <article class="card">
        <h2>更多工具</h2>
        <p>预留给后续新增的小工具、页面和测试内容。</p>
      </article>
    </section>

    <p class="foot">Shapez2 tools hub</p>
  </main>
</body>
</html>
